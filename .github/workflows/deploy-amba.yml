name: Deploy AMBA

on:
  workflow_dispatch:
    inputs:
      amba_ref:
        description: 'AMBA repo tag/branch to deploy from'
        required: true
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AMBA Repository
        uses: actions/checkout@v4
        with:
          repository: Azure/azure-monitor-baseline-alerts
          ref: ${{ github.event.inputs.amba_ref }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Login
        run: |
          az account show

      - name: Show Management Groups
        run: |
          az account management-group list -o table

      - name: Show Service Principal
        run: |
          az ad sp show --id $(az account show --query user.name -o tsv)

      - name: Show GitHub Service Principal
        run: |
          az account show
          az ad signed-in-user show || true
          az ad sp show --id $(az account show --query user.name -o tsv)

      - name: Deploy AMBA
        run: |
          echo "Deploying from ref: ${{ github.event.inputs.amba_ref }}"
          echo "Parameter file:"
          cat patterns/alz/alzArm.param.json
          az deployment mg create \
            --management-group-id 557036d3-e691-43dc-822d-270ab850a823 \
            --location uksouth \
            --template-file patterns/alz/alzArm.json \
            --parameters @patterns/alz/alzArm.param.json \
            --debug
