name: Deploy AMBA

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy AMBA Policies
        run: |
          az deployment sub create \
            --location uksouth \
            --template-file patterns/alz/alzArm.json \
            --parameters @patterns/alz/alzArm.param.json
